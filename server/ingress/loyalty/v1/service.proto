message CampaignConfig {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "Loyalty Campaign Config"
      description: "A loyalty campaign (season): its window, reset rules and tiers with their milestones."
      required: [
        "id",
        "name"
      ]
    }
  };
  string id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).string = {
      min_len: 1
      max_len: 256
      pattern: "^[A-Za-z0-9._-]+$"
    },
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Partner-chosen campaign identifier: letters, digits, dot, underscore and hyphen, up to 256 characters. An existing id updates that season; a new id creates one. A new id is a season boundary for every player: milestone claims are keyed by campaign."}
  ];
  string name = 2 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).string = {min_len: 1},
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Display name of the season."}
  ];
  optional google.protobuf.Timestamp start_at = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "When the season starts (RFC 3339). Omit on a draft. A future value schedules the season; on activation, omit to start now. Locked once the season is active."}];
  optional google.protobuf.Timestamp end_at = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "When the season ends (RFC 3339). Must be in the future when set and must not overlap another season. Omit for an open-ended season. May be changed on an active season."}];
  ResetRules reset = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "What happens to a player's points, milestone claims and currency when they first arrive in this season. Omit to keep the defaults: points carry, milestone claims reset, currency carries. Accepted only on shops whose loyalty points are held by Stash. Locked once the season is active."}];
  repeated TierConfig tiers = 6 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "The season's tiers with their milestones. Start points must be unique within the season."}];
  CampaignStatus status = 7 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Lifecycle status of the season. Ignored on input."}
  ];
}

message ResetRules {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "Loyalty Reset Rules"
      description: "How a player's state transitions into a season, applied when the player first arrives in it."
      required: [
        "points",
        "milestoneClaims",
        "currency"
      ]
    }
  };
  enum Points {
    POINTS_UNSPECIFIED = 0;
    // The points balance carries over unchanged.
    POINTS_CARRY = 1;
    // The points balance drops to the start of the player's current tier.
    POINTS_RESET_TO_TIER_START = 2;
  }
  enum MilestoneClaims {
    MILESTONE_CLAIMS_UNSPECIFIED = 0;
    // Earlier claims are cleared; every milestone of the season is claimable.
    MILESTONE_CLAIMS_RESET = 1;
    // Earlier claims are kept as history rather than cleared.
    MILESTONE_CLAIMS_CARRY = 2;
  }
  enum Currency {
    CURRENCY_UNSPECIFIED = 0;
    // Loyalty currency balances carry over unchanged.
    CURRENCY_CARRY = 1;
    // Loyalty currency balances are cleared.
    CURRENCY_RESET = 2;
  }
  Points points = 1 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).enum = {
      defined_only: true
      not_in: [0]
    },
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "What happens to the loyalty points balance."}
  ];
  MilestoneClaims milestone_claims = 2 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).enum = {
      defined_only: true
      not_in: [0]
    },
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "What happens to milestone claims."}
  ];
  Currency currency = 3 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).enum = {
      defined_only: true
      not_in: [0]
    },
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "What happens to loyalty currency balances."}
  ];
}

