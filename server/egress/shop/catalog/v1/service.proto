syntax = "proto3";

package server.egress.shop.catalog.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "server/egress/shop/catalog/v1/enums.proto";
import "server/egress/shop/v1/enums.proto";
import "validate/validate.proto";

option go_package = "github.com/stashgg/public-api/gen/proto/server/egress/shop/catalog/v1";

service CatalogService {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {
    name: "Catalog"
    description: "Product catalog endpoints"
  };
  rpc GetCatalog(GetCatalogRequest) returns (GetCatalogResponse) {
    option (google.api.http) = {get: "/api/v1/catalog"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get product catalog"
      description: "Retrieves the complete product catalog including all purchasable items, offer chains, and non-purchasable display items organized in rows."
      security: [
        {
          security_requirement: {key: "hmac"}
        }
      ]
    };
  }
  rpc GetOfferDetails(GetOfferDetailsRequest) returns (GetOfferDetailsResponse) {
    option (google.api.http) = {get: "/api/v1/catalog/offer"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get offer details"
      description: "Retrieves detailed information about a specific offer, including reward details and tabbed content with structured data tables for each item."
      security: [
        {
          security_requirement: {key: "hmac"}
        }
      ]
    };
  }
}

message LocalizableText {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "Localizable Text"
      description: "Text content that can be localized for a specific language. With format_syntax or format_arguments, the template is whichever text resolves for the request (localized_text, the text for localization_key, or default_text), so each language can place the entries differently. A template may be at most 4096 bytes and a composed text at most 8192 bytes (UTF-8). If the resolved template cannot be formatted (an unsupported construct, a missing entry, an invalid value, or a template or composed text over its limit), default_text is formatted with the same syntax and entries instead, and if that also fails the text is omitted. Entries that break a limit fail with any template, so the text is omitted, and entries sent without a format_syntax omit the text with no default_text retry. When the template comes from localization_key or localized_text, send a default_text with no placeholders, written in the same syntax (%% for a percent sign in printf-style, quoted braces in ICU-style), so the fallback renders whenever the entries themselves are valid. ICU-style templates read an entry by name or by zero-based index ({0} reads key \"0\") and use apostrophe quoting ('' is a literal apostrophe, '{' or '}' is a literal brace, and any other apostrophe, as in Don't, is literal); an unmatched or unquoted { or } is a formatting failure, and plural, select, selectordinal and typed arguments such as {n, number} are not supported. printf-style templates read keys \"1\", \"2\" and so on (one-based) in order for %s and %d, or explicitly for %1$s and %1$d, but not both in one template, and %% is a literal percent sign; %d requires an integer value, which is inserted unchanged, and flags, widths, precisions and other verbs are not supported"
    }
  };
  string default_text = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Default text content, usually in English (fallback if no localized text is provided or if region/language is not supported or cannot be determined)"}];
  oneof localization {
    string localization_key = 2 [
      (validate.rules).string = {
        min_len: 1
        ignore_empty: true
      },
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "The unique key used to identify the localized text content for a specific language"}
    ];
    string localized_text = 3 [
      (validate.rules).string = {
        min_len: 1
        ignore_empty: true
      },
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Localized text content for the language specified by the code sent in the request filters"}
    ];
  }
  map<string, string> format_arguments = 4 [
    (validate.rules).map = {
      max_pairs: 32
      keys: {
        string: {pattern: "^[A-Za-z0-9_]{1,64}$"}
      }
      values: {
        string: {max_bytes: 512}
      }
    },
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional entries substituted into the localized text using format_syntax. Each value is inserted as a literal display string, so send numbers and dates already formatted for the language. ICU-style templates read {name} or {0}; printf-style templates read keys \"1\", \"2\" in order. At most 32 entries, keys matching ^[A-Za-z0-9_]{1,64}$, values up to 512 bytes. If formatting fails, default_text is used instead, and if that fails too the text is omitted."}
  ];
  TextFormatSyntax format_syntax = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Template syntax used to compose the text with format_arguments. Leave unset, with no format_arguments, for plain text, which is displayed as-is. Sending format_arguments without a syntax is a formatting failure that omits the text, without a default_text retry. To use a syntax that is not listed, ask Stash to add it."}];
}

message GetCatalogRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "Get Catalog Request"
      description: "Request to retrieve the product catalog"
    }
  };
  optional CatalogPlatform platform = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional platform filter to get platform-specific catalog items"}];
  optional string region = 2 [
    (validate.rules).string = {
      min_len: 2
      max_len: 3
      ignore_empty: true
    },
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional region filter using ISO-3166-1 alpha-2 country code (e.g., 'US', 'EU', 'JP')"}
  ];
  optional string language = 3 [
    (validate.rules).string = {
      min_len: 2
      max_len: 3
      ignore_empty: true
    },
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional language code filter using ISO 639-1 code (e.g., 'en', 'es', 'fr', 'de')"}
  ];
  optional string player_id = 4 [
    (validate.rules).string = {
      min_len: 1
      ignore_empty: true
    },
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional player ID filter to get player-specific catalog items"}
  ];
  // The originating Stash shop, mirroring the shopId already sent in webhooks,
  // so the game backend can attribute the request to a specific shop.
  string shop_id = 6 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "The originating Stash shop identifier (mirrors the shopId sent in webhooks)"}];
  server.egress.shop.v1.PaymentEnvironment environment = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Payment environment for the request"}];
  // Resolved by Stash when a loyalty program is enabled; lets the game backend
  // return the catalog (e.g. a tier-based daily gift) for the player's tier
  // without resolving the tier itself.
  optional string current_tier_id = 7 [
    (validate.rules).string = {
      min_len: 1
      ignore_empty: true
    },
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional identifier of the player's current loyalty tier, resolved by Stash when a loyalty program is enabled. Use it to select the reward bundle for the player's current tier."}
  ];
  optional string next_tier_id = 8 [
    (validate.rules).string = {
      min_len: 1
      ignore_empty: true
    },
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional identifier of the loyalty tier directly above the player's current tier (absent at the top tier), resolved by Stash when a loyalty program is enabled. Use it to return a locked preview of the next tier's reward."}
  ];
}

message GetCatalogResponse {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "Get Catalog Response"
      description: "Contains the catalog data"
      required: ["catalog"]
    }
  };
  message Banner {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
      json_schema: {
        title: "Banner"
        description: "Generic banner for an emphasized title or heading, e.g. 'New Items', 'Limited Time', etc."
      }
    };
    LocalizableText text = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Banner text content for emphasized title or heading"}];
  }

  message Badge {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
      json_schema: {
        title: "Badge"
        description: "Generic badge for a status or label, e.g. 'New', 'Bonus', 'Free', etc."
      }
    };
    LocalizableText text = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Badge text for status or label (e.g., 'New', 'Bonus', 'Free')"}];
    optional BadgeAction action = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional action associated with the badge"}];
    optional LocalizableText strikethrough_text = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional strikethrough text for the badge, e.g. '24%' will be displayed as '~24%~'"}];
  }

  message SimpleBadge {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
      json_schema: {
        title: "Simple Badge"
        description: "Simple text badge for a status or label, e.g. 'New', 'Bonus', 'Free', etc."
      }
    };
    LocalizableText text = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Secondary badge text for status or label (e.g., 'New', 'Bonus', 'Free')"}];
  }

  message Button {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
      json_schema: {
        title: "Button"
        description: "Generic button for an action, e.g. 'Buy Now', 'View Details', etc."
      }
    };
    LocalizableText text = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Button text for action (e.g., 'Buy Now', 'View Details'). An info button may leave it out and show only its icon"}];
    optional string icon_image_url = 2 [
      (validate.rules).string = {
        uri: true
        ignore_empty: true
      },
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional URL to button icon image"}
    ];
    optional string background_style = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional CSS-style background styling information for button"}];
    optional Tooltip tooltip = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional popup tooltip for additional information. On an info button, a tap opens the tooltip, otherwise link_url; an unshowable tooltip or a non-https link_url counts as not sent, and an info button with neither is not shown. With information_type INFORMATION_TYPE_DROP_RATES the text may contain links written [label](url), e.g. 'For odds, see [here](https://example.com/odds)': the label ends at the first ], then ( and the url up to the first ), with no spaces (write ) as %29). Only that form is read; anything else shows as typed. A url not starting with lowercase https:// plus a host, or containing user@, shows its label as plain text, and an empty label shows nothing. Links are read after format_arguments are applied: an argument never starts or ends a link, may sit inside a label, and turns a link whose url contains it into plain text. In a printf-style template write % as %%, in an ICU-style one quote braces. Other tooltips read no links"}];
    optional InformationType information_type = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Info buttons only, ignored on buy and reveal buttons: the kind of information the button gives, INFORMATION_TYPE_RARITY (a reward's rarity) or INFORMATION_TYPE_DROP_RATES (the drop rates, the odds disclosure, of a reward or a whole offer), so the shop can style it by kind. With INFORMATION_TYPE_DROP_RATES, the tooltip text may contain links. Unset or unrecognized shows a general info button"}];
    optional string link_url = 6 [
      (validate.rules).string = {
        uri: true
        prefix: "https://"
        max_len: 2048
        ignore_empty: true
      },
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Info buttons only, ignored on buy and reveal buttons: optional URL of a page with more information, such as the full drop rates, starting with lowercase https://, opened when the player taps an info button that has no tooltip. With a tooltip, link the page from the tooltip text instead. A URL that is not https is ignored"}
    ];
  }

  message Callout {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
      json_schema: {
        title: "Callout"
        description: "Callout element for highlighting special features or guarantees"
      }
    };
    LocalizableText text = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Callout text (e.g., 'Guaranteed Featured Asset')"}];
    optional string icon_image_url = 2 [
      (validate.rules).string = {
        uri: true
        ignore_empty: true
      },
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional URL to callout icon image"}
    ];
  }

  message RewardBuff {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
      json_schema: {
        title: "Reward Buff"
        description: "Represents a reward buff or bonus applied to an item"
      }
    };
    float percentage = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Buff percentage (e.g. 3.5 for +3.5% additive, 300 for 3X multiplier)"}];
    RewardBuffType type = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Buff type (additive or multiplier)"}];
    string icon_image_url = 3 [
      (validate.rules).string = {
        uri: true
        ignore_empty: true
      },
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "URL to buff icon image"}
    ];
    optional string background_style = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional CSS-style background styling information for buff"}];
    optional string display_percentage = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional pre-formatted display string for the buff percentage (e.g. '+3.5%', '3X'). If set, takes priority over the numeric percentage field for display purposes."}];
  }

  message SpecialIndicatorTag {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
      json_schema: {
        title: "Special Indicator Tag"
        description: "A tag icon for an in-game item, for e.g. a special capability it unlocks"
      }
    };
    string icon_image_url = 1 [
      (validate.rules).string = {
        uri: true
        ignore_empty: true
      },
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "URL to special capability tag icon image"}
    ];
    optional Tooltip tooltip = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional popup tooltip for additional information"}];
  }

  message Background {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
      json_schema: {
        title: "Background"
        description: "Contains styling information for backgrounds. Note: At least one of image_url or background_style must be provided, and both can be provided when styles should be combined with the image."
      }
    };
    string image_url = 1 [
      (validate.rules).string = {
        uri: true
        ignore_empty: true
      },
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "URL to background image"}
    ];
    string background_style = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "CSS-style background styling information"}];
  }

  message Decal {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
      json_schema: {
        title: "Decal"
        description: "Contains an image to be displayed beside the main element, e.g. an offer."
      }
    };
    string image_url = 1 [
      (validate.rules).string = {
        uri: true
        ignore_empty: true
      },
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "URL to decal image displayed beside the main element"}
    ];
  }

  message Tooltip {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
      json_schema: {
        title: "Tooltip"
        description: "Generic tooltip for additional information about any element."
      }
    };
    LocalizableText text = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Tooltip text providing additional information"}];
  }

  message PriceAmountOrId {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
      json_schema: {
        title: "Price Amount Or ID"
        description: "The price Stash charges the player for one unit of the item, given as an amount or as a price ID that Stash resolves to an amount. It is the charged price, not a display value; a coupon discount, and any tax not already included in the price, adjust the order total"
      }
    };
    message PriceAmount {
      option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
        json_schema: {
          title: "Price Amount"
          description: "Price amount for the offer"
          required: [
            "currency",
            "cents"
          ]
        }
      };
      string currency = 1 [
        (google.api.field_behavior) = REQUIRED,
        (validate.rules).string = {
          min_len: 3
          max_len: 3
        },
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "ISO 4217 currency code (e.g., 'USD', 'EUR')"}
      ];
      uint32 cents = 2 [
        (google.api.field_behavior) = REQUIRED,
        (validate.rules).uint32.gt = 0,
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Amount in CLDR minor units for this ISO 4217 currency (integer smallest subdivision per CLDR for this code). Display scaling comes from public CLDR data for the currency, not from a separate field."}
      ];
    }
    oneof price {
      PriceAmount amount = 1;
      string price_id = 2 [
        (validate.rules).string = {
          min_len: 1
          ignore_empty: true
        },
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Price ID identifier"}
      ];
    }
  }

  message CatalogItem {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
      json_schema: {
        title: "Catalog Item"
        description: "Represents any type of catalog item using oneof for polymorphism"
      }
    };
    message PurchasableItem {
      option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
        json_schema: {
          title: "Purchasable Item"
          description: "Represents a purchasable product"
          required: [
            "product_id",
            "price"
          ]
        }
      };
      optional string guid = 1 [
        (validate.rules).string = {
          uuid: true
          ignore_empty: true
        },
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional unique identifier (UUID v4 if provided, otherwise generated)"}
      ];
      string product_id = 2 [
        (google.api.field_behavior) = REQUIRED,
        (validate.rules).string.min_len = 1,
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Required unique SKU/product identifier"}
      ];
      PurchasableItemType type = 13 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Type of purchasable item"}];
      LocalizableText name = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Display name of the item"}];
      LocalizableText description = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Description of the item"}];
      string image = 5 [
        (validate.rules).string = {
          uri: true
          ignore_empty: true
        },
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "URL to item image"}
      ];
      optional uint32 max_purchasable = 6 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "The player's remaining purchases of this item: how many more times this player can buy it. Compute it per player and send the current count on every response; Stash does not count purchases of this item itself. Stash reads it when checkout starts and refuses a purchase whose quantity exceeds it, so also enforce the limit when you confirm a purchase. When absent the item has no per-player purchase limit"}];
      optional LocalizableText max_purchasable_description = 10 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional description of the maximum number of times this item can be purchased"}];
      PriceAmountOrId price = 7 [
        (google.api.field_behavior) = REQUIRED,
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Price of the item"}
      ];
      optional google.protobuf.Timestamp expiration = 11 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional time after which this item can no longer be bought: Stash refuses a web shop cart or Buy Now purchase of the item that completes at or after this time. If a checkout grace period is agreed for your shop, a purchase that reached checkout before this time can still complete within that period, so ConfirmPayment can arrive after this time; approve it if you want those purchases to complete. Stop returning the item once it expires"}];
      optional google.protobuf.Timestamp refresh_at = 15 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional timestamp when this item's purchase allowance next resets, for display purposes such as a countdown. Purchase enforcement uses max_purchasable and expiration, never this field. A standalone item declares its own reset time here. An item inside a purchase pack has no refresh_at: the pack declares one reset time for all of its items, even when an item also carries its own max_purchasable."}];
      map<string, string> metadata = 12 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional key-value pairs to be included in webhook events related to this item. Not to be displayed or used for business logic. Use attributes for customizing the display."}];

      message PurchasableAttributes {
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
          json_schema: {
            title: "Purchasable Attributes"
            description: "Optional attributes for customizing how a product is displayed"
          }
        };
        optional Banner banner = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional banner for the item"}];
        optional Badge badge = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional badge for the item"}];
        optional Background background = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional background styling for the item"}];
        optional Tooltip tooltip = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional tooltip for the item"}];
        optional Button buy_button = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional buy button for the item"}];
        optional CatalogBorderType border_type = 6 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional border decoration type for this offer card"}];
        optional Button info_button = 7 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional info button for this offer as a whole, shown on the offer's card when present. Its information_type says what it explains, for example INFORMATION_TYPE_DROP_RATES for the drop rates (the odds disclosure) of an offer whose rewards are drawn at random. Leave it unset when there is nothing to explain, for example on coins only. A reward's own info button is contents[].info_button"}];
      }
      optional PurchasableAttributes attributes = 8 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional visual and behavioral attributes"}];

      message ContentItem {
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
          json_schema: {
            title: "Content Item"
            description: "Represents an in-game item obtainable as part of this bundle"
            required: ["quantity"]
          }
        };
        optional string guid = 1 [
          (validate.rules).string = {
            uuid: true
            ignore_empty: true
          },
          (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional unique identifier (UUID v4 if provided, otherwise generated). Note that product_id is not used b/c only the bundle is purchasable."}
        ];
