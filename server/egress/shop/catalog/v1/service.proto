              pattern: "^[0-9]+$"
            },
            (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional amount shown struck through next to this bonus's amount, as the amount before the offer's bonus, as string for big integer support (no decimals allowed). Display only: it is never granted and never changes what is granted. Leave it unset for no strikethrough."}
          ];
          optional string layout_key = 5 [
            (validate.rules).string = {
              min_len: 1
              max_len: 128
              ignore_empty: true
            },
            (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional key naming the reward slot of the offer's template that this bonus fills, compared exactly and case-sensitively against the slot keys agreed for your shop's offer templates. At most 128 characters; an empty or longer key is treated as absent. Display only: it never changes what is granted or the amount sent on the ConfirmPayment request. Optional, and ignored when absent or when the template names no reward slots, so omitting it leaves an existing response valid"}
          ];
        }
        repeated PurchasePackBonusItem bonus_items = 11 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional bonuses granted in addition to this item's contents when it is purchased, each an explicit type, id and amount. This is the typed, first-class representation of the item's bonus and takes precedence over contents[].bonus_quantity, which is an anonymous display projection carrying neither an id nor a type: when both are present, bonus_items decides what is granted and bonus_quantity is display only. On purchase, the amounts sent on the ConfirmPayment request's bonus_items are authoritative for the bonus ids they name and are the amounts to grant, so do not also grant the item's own bonus for an id already listed there or the player is credited twice."}];
        map<string, LocalizableText> text_slots = 12 [
          (validate.rules).map = {
            max_pairs: 50
            keys: {
              string: {max_len: 128}
            }
          },
          (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional text for the named text slots of this price point, keyed by slot name (for example Title or RibbonText), with the same rules and limits as the purchase pack's text_slots. For a slot name set both here and on the pack, this entry is used for this price point; the pack's entries fill every other slot, and of the combined entries Stash keeps the first 50 by slot name in byte order. An entry that is ignored here (an empty or longer key, or text that is empty or resolves to empty) leaves the pack's entry for that slot. A slot name repeated within the object keeps its first value, and the rest of the response still loads. Optional, and ignored when absent, so omitting it leaves an existing response valid"}
        ];
        optional uint32 max_purchasable = 13 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "The player's remaining purchases of this price point: how many more times this player can buy it. Compute it per player and send the current count on every response; Stash does not count purchases itself. 0 shows the price point sold out, and Stash refuses checkout for it. The pack's shared max_purchasable still applies, so the lower of the two limits this item. Stash reads it when checkout starts and refuses a purchase whose quantity exceeds it, so also enforce the limit when you confirm a purchase. When absent the price point has no limit of its own. To withdraw a price point entirely, leave it out of the response"}];
      }
    }

    oneof item {
      PurchasableItem product = 1;
      OfferChainItem chain = 2;
      NonPurchasableItem info = 3;
      FreeItem free = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Free-to-claim catalog item"}];
      PurchasePack pack = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "One offer sold at several prices, containing its purchasable items"}];
    }
  }

  message Catalog {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
      json_schema: {
        title: "Catalog"
        description: "Represents the complete product catalog"
      }
    };

    message CatalogTrigger {
      option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
