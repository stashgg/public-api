          (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Text content for this statistic"}
        ];
        map<string, string> text_style = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional CSS properties map for styling the statistic text (e.g., {\"text-transform\": \"uppercase\", \"color\": \"#ff6600\"})"}];
        optional string icon_image_url = 3 [
          (validate.rules).string = {
            uri: true
            ignore_empty: true
          },
          (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional URL to icon image for the statistic. If not provided, a generic icon will be used."}
        ];
      }
      optional RewardStatistics statistics = 6 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Statistics for this reward"}];
    }
    repeated RewardDetails rewards = 10 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Rewards contained in this item"}];
    optional google.protobuf.Timestamp last_updated_at = 11 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional timestamp of when this content item was last updated"}];
  }
  repeated ContentItem items = 1 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).repeated.min_items = 1,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Items contained in this offer"}
  ];

  message SectionHeader {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
      json_schema: {
        title: "Section Header"
        description: "Represents a header for a section of a view"
      }
    };
    LocalizableText title = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Title text for the section header"}];
    optional LocalizableText description = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Description text for the section header"}];
    string icon_image_url = 3 [
      (validate.rules).string = {
        uri: true
        ignore_empty: true
      },
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Icon image URL for the section header"}
    ];
  }
  optional SectionHeader rewards_header = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Header for the rewards section"}];
}
