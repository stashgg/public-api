        }
      };
      CatalogTriggerDisplayType display_type = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "How the trigger should be displayed"}];
      optional string icon_image_url = 2 [
        (validate.rules).string = {
          uri: true
          ignore_empty: true
        },
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional URL to the icon image for the trigger (e.g. floating gift button); clients should use a generic fallback when absent"}
      ];
      optional google.protobuf.Timestamp next_reset_at = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional timestamp for countdown until next reset or claim availability"}];
      optional string linked_section_guid = 4 [
        (validate.rules).string = {
          uuid: true
          ignore_empty: true
        },
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional UUID matching Section.guid of the popup section this trigger opens"}
      ];
    }

    message Section {
      option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
        json_schema: {
          title: "Catalog Section"
          description: "Represents a section of catalog items with a header, display type, and optional groups. When groups is non-empty, clients typically render group content as the section body; when groups is empty, section-level items is used as today. Section-level items and groups may both be populated. Optional background and display_expiration may style the section and drive a section-level countdown UI (display-only; per-offer expiration is what purchase enforcement uses)."
        }
      };
      optional string guid = 7 [
        (validate.rules).string = {
          uuid: true
          ignore_empty: true
        },
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional section identifier (UUID); referenced by catalog triggers to open this section (e.g. popup)"}
      ];
      LocalizableText header = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Row header text"}];
      repeated CatalogItem items = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Catalog items for this section in display order. Used when groups is empty, and may also be populated alongside groups."}];
      CatalogSectionDisplayType display_type = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "How the section should be displayed on the screen"}];
      message Group {
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
          json_schema: {
            title: "Catalog Section Group"
            description: "A titled group of catalog offers within a section; optional display size controls offer card sizing within the group."
            required: ["items"]
          }
        };
        LocalizableText header = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Group title, e.g. a bundle name"}];
        repeated CatalogItem items = 2 [
          (google.api.field_behavior) = REQUIRED,
          (validate.rules).repeated.min_items = 1,
          (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Offers in this group in display order"}
        ];
        optional CatalogGroupDisplayType display_type = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional per-group layout override"}];
        optional CatalogOfferDisplaySize display_size = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional display size for offer cards in this group"}];
      }
      repeated Group groups = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional offer groups within this section; array order is display order"}];
      optional Background background = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional background styling for this section"}];
      optional google.protobuf.Timestamp display_expiration = 6 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional timestamp for display-only section UI such as a countdown (e.g., 'Offers expire in 7d 19h'). Does not change purchase rules; only each offer's own expiration is enforced at purchase time."}];
    }
    repeated Section sections = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "List of catalog sections to be displayed in the order they are provided"}];
    repeated CatalogTrigger triggers = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional UI triggers (e.g. floating buttons) that open catalog sections by guid"}];
    optional Banner banner = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Optional banner shown once for the whole shop, for example a message about a bonus the player gets for buying on the web. It can differ per player, because the catalog is requested per player. Its text is a LocalizableText resolved to the player's language like any other text field. Display only: it never changes what is granted or charged. Omit it for no banner"}];
  }
  Catalog catalog = 1 [
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "The product catalog organized in sections"}
  ];
}

