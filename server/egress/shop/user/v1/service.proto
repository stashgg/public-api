syntax = "proto3";

package server.egress.shop.user.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "server/egress/shop/v1/enums.proto";
import "validate/validate.proto";

option go_package = "github.com/stashgg/public-api/gen/proto/server/egress/shop/user/v1";

service UserService {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {
    name: "Players"
    description: "Player management endpoints"
  };
  rpc GetPlayer(GetPlayerRequest) returns (GetPlayerResponse) {
    option (google.api.http) = {get: "/api/v1/player"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get player by ID"
      description: "Retrieves an existing player by ID. Returns player information including profile data and in-game currency balances."
      security: [
        {
          security_requirement: {key: "hmac"}
        }
      ]
    };
  }
}

message GetPlayerRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "Get Player Request"
      description: "Request to retrieve a player by ID"
      required: ["player_id"]
    }
  };
  string player_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).string.min_len = 1,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "The player ID to retrieve"}
  ];
  // The originating Stash shop, mirroring the shopId already sent in webhooks,
  // so the game backend can attribute the request to a specific shop.
  string shop_id = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "The originating Stash shop identifier (mirrors the shopId sent in webhooks)"}];
  server.egress.shop.v1.PaymentEnvironment environment = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Payment environment for the request"}];
}

message GetPlayerResponse {
  message Player {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
      json_schema: {
        title: "Player"
        description: "Represents a player in the system"
        required: ["player_id"]
      }
    };
    string player_id = 1 [
      (google.api.field_behavior) = REQUIRED,
      (validate.rules).string.min_len = 1,
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Unique identifier for the player"}
    ];
    string name = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Player name"}];
    string avatar_url = 3 [
      (validate.rules).string = {
        uri: true
        ignore_empty: true
      },
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "URL to player avatar image"}
    ];
    string language = 4 [
      (validate.rules).string = {
        min_len: 2
        max_len: 3
        ignore_empty: true
      },
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Player language preference using ISO 639-1 code (e.g., 'en', 'es', 'fr', 'de')"}
    ];
    uint32 in_game_level = 5 [
      (validate.rules).uint32 = {
        gt: 0
        ignore_empty: true
      },
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Player's in-game level, such as a power level. The web shop can show it on the player's profile. Must be positive; omit it when the game has no level, and the web shop then shows none"}
    ];
    uint32 in_game_currency = 6 [
      (validate.rules).uint32.gte = 0,
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "DEPRECATED: use wallet instead. Amount of in-game currency owned by player (must be non-negative, default 0). Holds a single currency only, and a value above 4294967295 fails the player lookup, so send large balances in wallet. Ignored for currency balances whenever wallet has at least one entry"}
    ];
    string region = 7 [
      (validate.rules).string = {
        len: 2
        ignore_empty: true
      },
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Player's region as an ISO 3166-1 alpha-2 country code (e.g., 'BR')"}
    ];
    string currency = 8 [
      (validate.rules).string = {
        len: 3
        ignore_empty: true
      },
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Player's preferred real-money currency as an ISO 4217 code (e.g., 'BRL'). This is not the in-game currency balance"}
    ];
    repeated UserBonusWallet wallet = 9 [
      (validate.rules).repeated.max_items = 100,
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Balances the player owns, one entry per in-game currency, keyed by the reward type id configured in Stash Studio. Send at most 100 entries; only the first 100 are read. Replaces in_game_currency and takes precedence over it whenever this list has at least one entry, even if every entry is ignored"
        max_items: 100
      }
    ];
  }
  Player player = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Player information"}];
}

enum WalletBonusType {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_enum) = {description: "Kind of balance a wallet entry reports. Only WALLET_BONUS_TYPE_IN_GAME_CURRENCY is read today; entries of any other type are ignored"};
  // Default unknown type; an entry with this type is ignored
  WALLET_BONUS_TYPE_UNSPECIFIED = 0;
  // A balance of an in-game currency configured as a reward type in Stash Studio
  WALLET_BONUS_TYPE_IN_GAME_CURRENCY = 1;
}

// One balance in a player's wallet
message UserBonusWallet {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "User Bonus Wallet"
      description: "One balance the player owns, for the reward type configured in Stash Studio with the same id"
      required: [
        "bonus_id",
        "bonus_type",
        "balance"
      ]
    }
  };
  string bonus_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).string = {
      min_len: 1
      max_len: 256
      pattern: "^[A-Za-z0-9._-]+$"
    },
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Id of the reward type configured in Stash Studio that this balance belongs to. Matched exactly and case-sensitively"}
  ];
  WalletBonusType bonus_type = 2 [
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Kind of balance. Must be WALLET_BONUS_TYPE_IN_GAME_CURRENCY; entries of any other type are ignored"}
  ];
  // Explicit presence, so an omitted balance is told apart from a real 0.
  optional uint64 balance = 3 [
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Amount the player owns, a non-negative 64-bit integer. Required; an entry without it is ignored. Send it as a JSON integer or as a decimal string; use a string for values above 9007199254740991, which many JSON parsers cannot represent exactly. 0 is a real balance. A negative, fractional or non-numeric value fails the whole player lookup, as it does for every numeric field of the player"}
  ];
}
