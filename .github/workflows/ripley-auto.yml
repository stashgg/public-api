name: Ripley (auto)

# Automatic trigger for the ripley-delegate PR reviewer — the companion to the
# on-demand /ripley:review comment workflow (ripley.yml). It fires on the
# same PR lifecycle points Bugbot uses: a PR opened ready for review, a draft
# promoted to ready, follow-up commits while ready, and a ready PR reopened.
# Drafts never trigger a review (the draft==false gate). Actions runs no agent
# and checks out no code; it signs a request to the delegate, which does all the
# compute and posts the ack, description stamp, review comments, and the "Ripley"
# check run as stash-ripley[bot]. This workflow uploads the delegate response as
# a run artifact and reports failures only.
#
# There is no ack_comment_id here (no comment triggered it), so the delegate
# acks the PR itself with an eyes reaction. Requires the RIPLEY_REVIEW_SECRET
# Actions secret (the org-level HMAC key the delegate verifies).

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]

# pull-requests:write for the failure-reply comment; statuses:write for the
# failure-fallback commit status. Success posts nothing itself — the delegate's
# check run + comments are the record. (Same permission shape as the on-demand
# workflow.)
permissions:
  pull-requests: write
  statuses: write

jobs:
  trigger:
    # Ready-for-review PRs on this repo only. draft==false is what makes this
    # mirror Bugbot: an opened-ready PR and a draft->ready promotion both pass,
    # a push while ready (synchronize) passes, a push while draft is skipped, and
    # a reopened ready PR passes. The head-repo guard skips forks (whose runs get
    # no secret anyway) so we never auto-spend on external PRs.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 35
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # Shared group with the on-demand /ripley:review workflow (same ripley-<pr>
    # key) so a manual re-trigger and an auto run never review the same PR at
    # once. cancel-in-progress is false: the delegate detaches the review from
    # the request (context.WithoutCancel) and keeps reviewing after the Actions
    # HTTP client is cancelled, so cancelling a superseded run does NOT stop its
    # review — it just lets a stale-head verdict post after the newer one and
    # lets two same-head runs collide on the delegate's per-PR run directory.
    # false serializes safely (matching ripley.yml, which shares this
    # group).
    concurrency:
      group: ripley-${{ github.event.pull_request.number }}
      # cancel-in-progress stays FALSE. Cancelling the job kills this workflow
      # and its curl, but not the review: handleReview runs under
      # context.WithoutCancel, so the delegate finishes and bills the superseded
      # run anyway -- while a replacement starts beside it, breaking the one
      # review per PR this group exists to enforce. Flipping it costs tokens and
      # buys nothing until the delegate has a PR-keyed cancellation that
      # terminates the run and settles its check.
      cancel-in-progress: false

    steps:
      # Build the request body once, in a step with no secret in its environment;
      # the signing step signs these exact bytes and POSTs them. Handled failures
      # (curl error, non-200, status!=ok) record an outcome and exit zero there so
      # the final step can report them; the final step reddens the run. The PR
      # event carries the head SHA and PR number directly — no lookup needed
      # (unlike the comment workflow).
      - name: Build request body
        id: build
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Spend attribution. requested_by is the event's SENDER — whoever pushed,
          # opened, reopened or marked ready — because that is who caused this review to
          # run and therefore who spent the tokens. pr_author is whose pull request it
          # is. They are equal when someone generates reviews on their own work, which
          # is the dominant cost pattern (a restacked stack re-triggers every branch),
          # and a single field could not tell that apart from anything else.
          REQUESTED_BY: ${{ github.event.sender.login }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          # opened | synchronize | reopened | ready_for_review. This is what turns "who
          # spends" into "what they did that spends" — a per-user total says someone is
          # expensive, the same total split by event says eight restacks were.
          EVENT: ${{ github.event.action }}
        run: |
          set -uo pipefail

          # This trigger has exactly one verb. It still publishes verb and
          # endpoint because the two steps below are shared byte-for-byte with the
          # on-demand dispatcher (ripley.yml), which resolves its verb from the
          # comment — a parity test pins that sameness, and it is what stops the
          # signing and retry logic from drifting between the two triggers.
          echo "verb=review" >> "$GITHUB_OUTPUT"
          echo "endpoint=https://agents.stash-eng.com/ripley/review" >> "$GITHUB_OUTPUT"

          # Live review, so shadow is false. No ack_comment_id — auto-triggered,
          # so there is no comment to react on; the delegate acks the PR itself.
          # pr_number stays a JSON number via --argjson. The attribution fields reach
          # the shell through env: and jq through --arg, so they are data on every hop
          # and never script; the delegate shape-checks them and drops what it cannot
          # recognize rather than refusing the review over a label.
          jq -cn \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg head_sha "$HEAD_SHA" \
            --arg requested_by "$REQUESTED_BY" \
            --arg pr_author "$PR_AUTHOR" \
            --arg event "$EVENT" \
            --argjson pr "$PR_NUMBER" \
            '{repo: $repo, pr_number: $pr, shadow: false, head_sha: $head_sha,
              requested_by: $requested_by, pr_author: $pr_author, event: $event}' \
            > body.json

      # Sign the exact bytes and POST them, re-signing on each attempt. This is the
      # only step that receives RIPLEY_REVIEW_SECRET — signing and sending are one
      # step because a retry needs a fresh signature and the signer is what mints it.
      #
      # The key reaches python through that one process's environment (os.environb),
      # never as an argument, so it cannot be read out of any process listing; the -c
      # program is a fixed single-quoted string the shell does not expand. openssl
      # cannot sign here: dgst -hmac and openssl mac both accept the key only as an
      # argument. The signature reaches curl through a config file rather than an
      # argument, and every file holding either lives in $RUNNER_TEMP rather than the
      # workspace, so neither outlives the call nor becomes a candidate for artifact
      # upload or caching. The EXIT trap removes them on every path out, including the
      # early exits below.
      #
      # Retry exists for one response only: a capacity refusal. The delegate bounds how
      # many reviews run at once, and a burst past that bound is answered with
      # stage=admission — a pull request whose only mistake was arriving alongside
      # others. Treating that as a failed review would redden it and drop the review
      # entirely, so it waits and asks again. Every other failure keeps its original
      # behavior and fails on the first response; a retry there would hide real errors
      # behind silent repetition.
      #
      # Each attempt re-signs rather than replaying. The delegate accepts a signature
      # within a few minutes of its timestamp, and an admission wait can exceed that on
      # its own, so a replayed signature would be rejected as stale and the retry would
      # fail for a reason that has nothing to do with capacity.
      - name: Sign and send
        id: request
        env:
          RIPLEY_REVIEW_SECRET: ${{ secrets.RIPLEY_REVIEW_SECRET }}
          ENDPOINT: ${{ steps.build.outputs.endpoint }}
        run: |
          set -uo pipefail

          # The build step records an outcome and exits zero when it cannot
          # resolve a verb. Its files are the report; signing a request to an
          # endpoint it never resolved would overwrite them with a curl error
          # and hide the real cause.
          if [ -f outcome.txt ]; then
            echo "Build step already recorded an outcome; nothing to send."
            exit 0
          fi

          # A secret can only enter a step through env:, and a step's environment is
          # inherited by every child it spawns. Hold the key in a shell variable and drop
          # it from the environment, so curl, jq, date, cat and the retry sleep all start
          # without it; the signer gets it back as a one-command prefix assignment, which
          # the shell places in that one process's environment and in no argv. What this
          # does not do is scrub the key from this shell's own process image — unset does
          # not reliably rewrite that — and no workflow can, because Actions delivers a
          # secret to a step by putting it there.
          key=$RIPLEY_REVIEW_SECRET
          unset RIPLEY_REVIEW_SECRET

          # A secret the repository was never granted arrives as the empty string rather
          # than unset, so an unguarded run signs with an empty key and the delegate
          # answers 401 — which reads as a delegate fault rather than as a repository
          # that was never wired up. Name the secret instead.
          if [ -z "$key" ]; then
            echo error > outcome.txt
            echo configuration > stage.txt
            echo "RIPLEY_REVIEW_SECRET is empty: this repository has no access to the organization-level RIPLEY_REVIEW_SECRET Actions secret. Grant it to this repository and re-run." > detail.txt
            echo false > surfaced.txt
            exit 0
          fi

          sig_config="$RUNNER_TEMP/ripley-signature.conf"
          trap 'rm -f "$sig_config"' EXIT

          # One attempt: mint a current timestamp, sign "<ts>.<body bytes>", write the
          # header to a private config file, and POST. Timestamp and digest stay in
          # shell variables this step never writes to disk; only the header file is
          # created, under umask 077.
          post_once() {
            ts=$(date +%s%3N)
            sig=$({ printf '%s.' "$ts"; cat body.json; } \
              | RIPLEY_REVIEW_SECRET="$key" python3 -c 'import hashlib, hmac, os, sys; print(hmac.new(os.environb[b"RIPLEY_REVIEW_SECRET"], sys.stdin.buffer.read(), hashlib.sha256).hexdigest())')
            (umask 077; cat > "$sig_config") <<EOF
          header = "Content-Type: application/json"
          header = "X-Steve-Signature: t=${ts},v1=${sig}"
          EOF

            curl_rc=0
            http_status=$(curl -sS -o response.json -w '%{http_code}' \
              --max-time 970 \
              -X POST \
              --config "$sig_config" \
              --data-binary @body.json \
              "$ENDPOINT") || curl_rc=$?
          }

          # Both attempts are bounded by the job deadline, and the arithmetic below is
          # what sets timeout-minutes rather than the other way round.
          #
          # A request costs its admission wait plus its review, and those are
          # complementary by construction: the delegate derives admission as
          # (balancer deadline - review ceiling - margin), so A + R = 950s for every
          # ceiling R. That is the constant curl's --max-time 970 is sized against.
          #
          # A retry spends its OWN admission wait; it does not inherit a place in the
          # queue. So the worst case is two full requests, not one plus a review:
          #
          #   first request, refused at its admission budget      A + 0
          #   retry delay                                          + 45
          #   second request, admitted late and reviewed          A + R
          #   ----------------------------------------------------------
          #   total                                    2A + 45 + R = 1945 - R
          #
          # 1345s at a 600s ceiling, 1645s at 300s. An earlier version of this comment
          # counted one admission window instead of two, concluded 995s, and set the
          # job deadline from that — which would have had the job cancelled mid-retry
          # at every ceiling below 900s. A cancelled job skips the reporting step, so
          # the pull request is left with no verdict at all: worse than the red check
          # the retry exists to prevent.
          #
          # timeout-minutes is therefore 35 (2100s), which covers 1945s with room for
          # setup and reporting, and covers ceilings well below the 300s case above.
          # The cost is runner minutes on a job that retries; that only happens under
          # sustained capacity pressure, which the cap and the admission budget exist
          # to make rare.
          #
          # A third attempt is what does not fit, so the bound is two.
          max_attempts=2
          retry_delay=45
          attempt=1

          while : ; do
            post_once

            if [ "$curl_rc" -ne 0 ]; then
              echo error > outcome.txt
              echo request > stage.txt
              echo "curl exited ${curl_rc} calling the delegate (network error or timeout past --max-time)" > detail.txt
              # No response body means the delegate posted nothing itself, so the
              # fallback status/comment below is the only failure signal — keep it.
              echo false > surfaced.txt
              exit 0
            fi

            status=$(jq -r '.status // empty' response.json 2>/dev/null || echo '')
            if [ "$http_status" = "200" ] && [ "$status" = "ok" ]; then
              echo ok > outcome.txt
              echo false > surfaced.txt
              echo "Delegate returned HTTP 200 status=ok (attempt ${attempt})."
              break
            fi

            stage=$(jq -r '.stage // "delegate"' response.json 2>/dev/null || echo delegate)

            # The one retryable answer. Anything else is a real failure and is reported
            # on its first response.
            if [ "$stage" = "admission" ] && [ "$attempt" -lt "$max_attempts" ]; then
              echo "Delegate at capacity (attempt ${attempt}/${max_attempts}); retrying in ${retry_delay}s."
              attempt=$((attempt + 1))
              sleep "$retry_delay"
              continue
            fi

            echo error > outcome.txt
            printf '%s\n' "$stage" > stage.txt
            detail=$(jq -r '.detail // empty' response.json 2>/dev/null || echo '')
            if [ -z "$detail" ]; then
              detail="delegate returned HTTP ${http_status} status='${status:-none}'"
            fi
            if [ "$stage" = "admission" ]; then
              # ${attempt}, not ${max_attempts}: reporting a count that never ran sends
              # the reader looking for requests that were never made.
              detail="delegate still at capacity after ${attempt} attempt(s): ${detail}"
            fi
            printf '%s\n' "$detail" > detail.txt
            # surfaced=true means the delegate already posted its own failure check
            # run + PR-body stamp, so the fallback status/comment below would be a
            # duplicate — suppress it (still fail the run). Absent/false => post it.
            jq -r 'if .surfaced == true then "true" else "false" end' response.json 2>/dev/null > surfaced.txt || echo false > surfaced.txt
            exit 0
          done

      # Upload the response body whether the call succeeded or failed.
      - name: Upload Ripley review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ripley-review-pr${{ github.event.pull_request.number }}
          path: response.json
          if-no-files-found: warn

      # The delegate posts its own feedback and owns the in-flight Ripley check
      # run, settling it itself. This step reports failures only: when the request
      # never completed, it stamps a red Ripley commit status (renders regardless
      # of check-suite quirks), posts the failure detail on the thread, and reddens
      # the run. On success it does nothing — the delegate's check is the record.
      - name: Report failures
        # Skip on cancellation: a cancelled run (the job deadline, or a human
        # cancelling it) may have no outcome.txt, which always() would misread as an
        # error and post a false failure status and PR comment. !cancelled() still runs
        # on real success and real failure.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERB: ${{ steps.build.outputs.verb }}
        run: |
          set -uo pipefail

          # Empty when the build step failed before resolving a verb; the failure
          # report still has to name something.
          verb=${VERB:-request}

          # Every GitHub field this step needs arrives through env:, and
          # $GITHUB_REPOSITORY is already in the runner environment. An Actions
          # expression is substituted into the script text before the shell parses it,
          # so a script that reads one is only as trustworthy as that field's
          # provenance; a shell variable is never substituted into the script at all,
          # which makes the property hold without auditing each field.
          outcome=$(cat outcome.txt 2>/dev/null || echo error)

          # A near-miss comment ("/ripley:fixture") dispatched nothing and owes
          # nothing: green run, no status, no comment.
          if [ "$outcome" = "skip" ]; then
            echo "Not a ripley command; nothing was dispatched."
            exit 0
          fi

          if [ "$outcome" = "ok" ]; then
            echo "Delegate completed the $verb; its check run carries the verdict."
            # Commit statuses are sticky per context+SHA: if an earlier attempt
            # on this same head left a red Ripley status, clear it — otherwise
            # post no status at all (the delegate's check run is the record).
            if [ -n "${HEAD_SHA:-}" ]; then
              latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/statuses" \
                --jq '[.[] | select(.context=="Ripley")][0].state // empty' 2>/dev/null || echo '')
              if [ "$latest" = "failure" ] || [ "$latest" = "error" ]; then
                gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
                  -f state=success -f context=Ripley \
                  -f description="Ripley $verb completed by the delegate on retry" \
                  -f target_url="$RUN_URL" || true
              fi
            fi
          else
            surfaced=$(cat surfaced.txt 2>/dev/null || echo false)
            if [ "$surfaced" = "true" ]; then
              # Delegate surfaced the failure itself: its red check run is the
              # authoritative signal and its PR-body stamp carries the detail. Get
              # out of the way — no duplicate status/comment — but clear any stale
              # red Ripley status a prior non-surfaced attempt left on this SHA
              # (sticky per context+SHA) and fail the run.
              if [ -n "${HEAD_SHA:-}" ]; then
                latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/statuses" \
                  --jq '[.[] | select(.context=="Ripley")][0].state // empty' 2>/dev/null || echo '')
                if [ "$latest" = "failure" ] || [ "$latest" = "error" ]; then
                  gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
                    -f state=success -f context=Ripley \
                    -f description='Delegate surfaced the failure via its check run' \
                    -f target_url="$RUN_URL" || true
                fi
              fi
              exit 1
            fi
            # Not surfaced — the delegate posted no check run, so the fallback red
            # status + comment are the only failure signal.
            if [ -n "${HEAD_SHA:-}" ]; then
              gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
                -f state=failure -f context=Ripley \
                -f description="Ripley $verb failed; see run logs" -f target_url="$RUN_URL" || true
            fi
            stage=$(cat stage.txt 2>/dev/null || echo unknown)
            detail=$(cat detail.txt 2>/dev/null || echo 'no detail captured')
            body=$(printf '**Ripley %s failed**\n\n- Stage: %s\n- Detail: %s\n\nSee the [workflow run](%s) for logs.' \
              "$verb" "$stage" "$detail" "$RUN_URL")
            gh api \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="$body"
            exit 1
          fi
